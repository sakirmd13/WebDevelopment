```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Basic</title>
</head>
<body>
    <h1>HTML Basic</h1>
</body>
</html>
```
<!-- 
**1. `<!DOCTYPE html>`**
This is a declaration, not a tag. It tells the browser that the document uses modern HTML5.

**2. `<html>`**
This is the root element. It wraps the entire HTML document.

**3. `<head>`**
Contains information about the webpage that is not directly displayed on the page.

**4. `<meta>`**
Provides metadata, such as character encoding and viewport settings. It is a void element, so it does not need a closing tag.

**5. `<title>`**
Defines the title shown in the browser tab.

**6. `<body>`**
Contains all the visible content of the webpage, such as headings, paragraphs, images, and buttons.

**7. `<h1>`**
Defines the main heading of the page. It is usually the most important heading.

**8. `</body>` and `</html>`**
These closing tags mark the end of the body and the entire HTML document.

```

**Remember:** `head` = page information, `body` = visible page content.
``` -->
