<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Element & Tag</title>
  </head>
  <body>
    <h1>Element & Tag</h1>
    <p>
      In professional HTML development, an element is a node in the DOM
      (Document Object Model). It represents a structured part of the document.
    </p>
    <p>A tag is the markup syntax used to create that element.</p>
    <div class="card" title="Class Tag">
      <h2>Product Name</h2>
      <p>Product description</p>
    </div>
  </body>
</html>

<!-- Element: An HTML element is a complete building block of a webpage. It usually includes an opening tag, content, and a closing tag.

Tag: A tag is a keyword written inside angle brackets < >. It tells the browser what type of content something is.

Opening Tag: The opening tag starts an element. It is written with the element name inside angle brackets.

Example:

<p>

Closing Tag: The closing tag ends an element. It contains a forward slash / before the element name.

Example:

</p>

Self-Closing Tag: A self-closing tag does not need a separate closing tag because it does not contain content. In HTML, these are commonly called void elements.

Example:

<br>
<img src="image.jpg" alt="A photo"> -->
