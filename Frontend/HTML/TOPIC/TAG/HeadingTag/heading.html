<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heading Tag</title>
  </head>
  <body>
    <h1>Heading 1</h1>
    <h2>Heading 2</h2>
    <h3>Heading 3</h3>
    <h4>Heading 4</h4>
    <h5>Heading 5</h5>
    <h6>Heading 6</h6>
  </body>
</html>


<!-- Heading tags are semantic HTML elements, meaning they describe the structure and meaning of content. They improve SEO (Search Engine Optimization), accessibility, and readability. Developers generally use <h1> for the main page heading, <h2> for major sections, and <h3> for subsections. Heading sizes can be changed using CSS. -->
