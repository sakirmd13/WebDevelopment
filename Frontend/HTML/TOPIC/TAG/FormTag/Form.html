<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
  </head>
  <body>
    <div>
      <h2>Form Tag</h2>
      <form action="">
        <p>Input tage With type attribute</p>
        <input type="text" />
        <br /><br />
        <input type="email" />
        <br /><br />
        <input type="password" />
        <br /><br />
        <p>Input tage With type and Placeholder attribute</p>
        <input type="text" placeholder="Enter Your Name " />
        <br /><br />
        <input type="email" placeholder="Enter Your email" />
        <br /><br />
        <input type="password" placeholder="Enter your password" />
        <br /><br />

        <label for="password">Select redio button</label>
        <input
          type="password"
          placeholder="Enter your password"
          id="password"
        />
        <br /><br />
        <label for="checkbox">Are you agrrey</label>
        <input type="checkbox" id="checkbox" />
        <br /><br />
        <label for="number">Enter your number :</label>
        <input type="number" id="number" min="0" required />

        <br />
        <br />

        <fieldset>
            <legend>Basic information</legend>
          <p>radio Without name select both</p>
          <label for="Gender">Gender</label>
          <label for="Gender">Male</label>
          <input type="radio" id="Gender" />
          <label for="Gender">FeMale</label>
          <input type="radio" id="Gender" />
          <br />
          <br />
          <p>radio Select only one</p>
          <label for="Gender">Gender :</label>
          <label for="male">Male :</label>
          <input type="radio" id="male" name="Gender" required />
          <label for="FeMale">FeMale :</label>
          <input type="radio" id="FeMale" name="Gender" required />
          <br /><br />
          <label for="date">DOB : </label>
          <input type="date" id="date" required />

          <br /><br />
          <label for="file">File : </label>
          <input type="file" id="file" required />

          <br /><br />
          <button type="reset">Reset</button>
          <button type="submit">Submit</button>

          <br /><br />
          <label for="city">City</label>
          <select name="city" id="city">
            <option value="delhi">delhi</option>
            <option value="Bihar" selected>Bihar</option>
          </select>
        </fieldset>
      </form>
    </div>
  </body>
</html>
