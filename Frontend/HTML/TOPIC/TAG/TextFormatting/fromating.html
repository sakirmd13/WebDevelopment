<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Formating</title>
  </head>
  <body>
    <b>I am Bold</b>
    <br />
    <strong>I am strong tag</strong>

    <br />

    <i>I am italic tag</i>
    <br />
    <em>I am emphasize tag</em>

    <br />
    <mark>I am mark tag</mark>
    <br />

    <s>I am strike tag </s>
    <br />
    <u>I am Underlin</u>
    <br />
    <p>x<sup>2</sup>+ y<sup>2</sup>+ 2ab =(x+y)<sup>2</sup></p>

    <p>h<sub>2</sub>o</p>
    <small>I am small tag</small>
    <br />
    <code> This is a code tag </code>
  </body>
</html>




<!-- <b> vs <strong> — Both make text bold, but <b> is purely visual (no extra meaning), while <strong> tells the browser and screen readers "this text is important." Use <strong> when meaning matters (accessibility/SEO), <b> when it's just style.
<i> vs <em> — Same story. <i> is visual italics (used for things like foreign words or ship names), <em> means "emphasize this" — it changes the tone if read aloud by a screen reader.
<mark> — Highlights text, like a yellow marker, usually to show relevance (e.g., search results).
<s> — Strikethrough, used to show something is no longer true or accurate (like a crossed-out price).
<u> — Underlines text. Rarely used now because underlines usually mean "this is a link" to users — can cause confusion.
<sup> / <sub> — Superscript and subscript, used for math (x²) and chemistry (H₂O) notation.
    <small> — Represents "fine print" — legal disclaimers, side comments — semantically smaller/less important text.
    <code> — Marks text as computer code, usually rendered in a monospace font. -->
