<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
     <style>
        table ,td ,tr{
            border: 2px solid red;
        }
    </style>
</head>
<body>
    <div>
        <table>
            <thead>
                <tr>
                    <td>Subject</td>
                    <td>Marks</td>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Hindi</td>
                    <td>20</td>
                </tr>
                <tr>
                    <td>English</td>
                    <td>70</td>
                </tr>
                <tr>
                    <td>Math</td>
                    <td>80</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td>Total</td>
                    <td>170</td>
                </tr>
            </tfoot>
        </table>
    </div>
</body>
</html>
