
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image</title>
  </head>
  <body>
    <div>
      <h2>Image Tag</h2>

      <figure>
        <!-- Image using an HTTPS link -->
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSBB4LQTn0vRq4ydPLp-uTj_lEUHOHYWUU18JlCq5KuMw&s=10"
          alt="Butterfly"
        />

        <figcaption>
          This image is of a butterfly.
        </figcaption>
      </figure>

      <p>
        The figure element groups an image with its caption. The img
        element displays the image on the webpage. The src attribute
        specifies the image URL, while the alt attribute provides
        alternative text that describes the image. The figcaption
        element provides a visible caption for the image.
      </p>
    </div>
  </body>
</html>
