<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iframe</title>
  </head>
  <body>
    <div>
      <h2>I freame tag basic without fullscreen</h2>
      <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/HcOc7P5BMi4?start=49"
        title="HTML Tutorial for Beginners"
        
       
      >
      </iframe>
    </div>
    <div>
      <h2>I freame tag</h2>
      <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/HcOc7P5BMi4?start=49"
        title="HTML Tutorial for Beginners"
        frameborder="0"
        allow="
          accelerometer;
          autoplay;
          clipboard-write;
          encrypted-media;
          gyroscope;
          picture-in-picture;
          web-share;
        "
        allowfullscreen
      >
      </iframe>
    </div>

    <div>
        <h2>Map With iframe</h2>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d14005.057945689832!2d77.192916!3d28.651798350000004!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x390d029c5f402ed3%3A0x942174294c9dd946!2sKarol%20Bagh%2C%20New%20Delhi%2C%20Delhi!5e0!3m2!1sen!2sin!4v1789498121968!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>
  </body>
</html>
