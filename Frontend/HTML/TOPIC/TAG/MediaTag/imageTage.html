
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image</title>
  </head>
  <body>
    <div>
      <h2>Image Tag</h2>

      <!-- Image using an HTTPS link -->
      <img
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSBB4LQTn0vRq4ydPLp-uTj_lEUHOHYWUU18JlCq5KuMw&s=10"
        alt="Butterfly"
      />
    </div>

    <div>
      <p>
        Image tag with height and width attributes using an HTTPS link
      </p>

      <!-- Image using an HTTPS link with height and width -->
      <img
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSBB4LQTn0vRq4ydPLp-uTj_lEUHOHYWUU18JlCq5KuMw&s=10"
        alt="Butterfly"
        height="100"
        width="100"
      />
    </div>

    <div>
      <p>
        Image tag with height and width attributes using a local image
      </p>

      <!-- Local image -->
      <img
        src="./image/localimage.png"
        alt="Local image"
        
      />
    </div>
    <div>
      <p>
        Image tag with height and width attributes using a local image
      </p>

      <!-- Local image with height and width -->
      <img
        src="./image/localimage.png"
        alt="Local image"
        height="100"
        width="100"
      />
    </div>
  </body>
</html>
