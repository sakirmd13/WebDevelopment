<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inline</title>
  </head>
  <body>
    <span style="border: 2px solid yellow">I am span tag</span>
  </body>
</html>


<!-- 
<span> is an inline-level, generic container — the inline counterpart to <div>. Just like <div>, it carries no semantic meaning on its own; its only job is to group a small piece of content (usually text) so you can style or script it, without breaking the natural flow of the line (unlike <div>, which is block-level and always starts on a new line).

Key differences from <div>, in real-world terms:

<div> → block-level → takes full width, starts on a new line, used for big structural sections (headers, cards, containers).
<span> → inline-level → only takes as much width as its content, stays in the flow of text, used for small tweaks — like coloring one word, wrapping an icon next to text, or targeting a specific word with JavaScript (e.g., a live word counter highlighting one term). -->
