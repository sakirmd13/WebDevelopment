<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- External CSS animation file connect ki hai -->
    <link rel="stylesheet" href="./animation.css" />

    <title>CSS Animation</title>
  </head>
  <body>
    <!-- Container ke andar animation boxes hain -->
    <div class="container">
      <!-- First animation box -->
      <div class="box item1">item1</div>

      <!-- Second animation box -->
      <div class="box item2">item2</div>

      <!-- Third animation box -->
      <div class="box item3">item3</div>
    </div>

    <!-- Button par bhi CSS animation apply hai -->
    <button class="btn">click</button>
    <!-- Spinner animation button -->
    <button class="btn1">Spinner</button>
  </body>
</html>
