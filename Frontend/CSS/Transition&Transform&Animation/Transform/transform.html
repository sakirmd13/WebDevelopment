
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transform</title>

    <!-- External CSS file connect ki hai -->
    <link rel="stylesheet" href="./transform.css">
</head>
<body>

    <!-- CSS Transform ke different functions practice karne ke liye container -->
    <div class="transform-container">

        <!-- Translate X: Right / Left movement -->
        <div class="transform-box transform-translate-x">transform-translate-x</div>

        <!-- Translate Y: Up / Down movement -->
        <div class="transform-box transform-translate-y">transform-translate-y</div>

        <!-- Translate X + Y: Both direction movement -->
        <div class="transform-box transform-translate-xy">transform-translate-xy</div>

        <!-- Scale: Element ka size change -->
        <div class="transform-box transform-scale">transform-scale</div>

        <!-- Rotate: Element ko rotate karna -->
        <div class="transform-box transform-rotate">transform-rotate</div>

        <!-- Skew: Element ko slant karna -->
        <div class="transform-box transform-skew">transform-skew</div>

    </div>

    <!-- Multiple transform functions practice karne ke liye button -->
    <button class="transform-btn">Transform Button</button>

</body>
</html>
