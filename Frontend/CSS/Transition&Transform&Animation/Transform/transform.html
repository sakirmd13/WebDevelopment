
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform</title>

    <!-- External CSS file connect ki hai -->
    <link rel="stylesheet" href="./transform.css">
</head>
<body>

    <!-- Container ke andar sabhi transform boxes hain -->
    <div class="container">

        <div class="box translate-x">translate-x</div>

        <div class="box translate-y">translate-y</div>

        <div class="box translate-x-y">translate-x-y</div>

    </div>

    <!-- Transform properties practice karne ke liye button -->
    <button class="btn">click me</button>

</body>
</html>
