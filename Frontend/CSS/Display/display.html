
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Display Property</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="./display.css">
</head>

<body>

    <!-- Display: Inline -->
    <p class="one">
        Display inline element ko same line me place karta hai.
    </p>

    <br><br>

    <!-- Display: Block -->
    <span>
        Display block element ko new line me place karta hai.
    </span>

    <br><br>

    <!-- Display: None -->
    <p class="two">
        Display none element ko completely hide kar deta hai.
    </p>

    <!-- Visibility: Hidden -->
    <p class="three">
        Visibility hidden element ko invisible karta hai lekin uski space
        preserve rakhta hai.
    </p>

</body>
</html>
